packages:
  - playground
  - playground-v5

overrides:
  "@nuxt/kit@4": "4.6.3"
  "@nuxtjs/turnstile": "workspace:*"

packageExtensions:
  '@nuxt/scripts':
    peerDependencies:
      nuxt: '*'

shamefullyHoist: true

strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@nuxt/*'
  - nuxt-nightly
  - nuxt@4.6.2
